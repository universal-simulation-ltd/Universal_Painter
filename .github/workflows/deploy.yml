# Push to main → test → build → wrangler deploy (Worker: static assets, no script).
# Same token as the portal's workflow; account_id is hardcoded in
# wrangler.jsonc so the token doesn't need "User Details: Read".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # ⚠️ PINNED EXACTLY, as across the suite: a floating major broke every
          # deploy at once on 2026-08-11. Bump deliberately, after checking
          # `npm view wrangler@<v> dependencies.miniflare` resolves.
          wranglerVersion: '4.120.1'
          command: deploy
