    <!-- ⚠️ THE THEME, BEFORE THE FIRST PIXEL. Inline so a dark-mode user never
         sees a pale frame first. The app key holds this app's override (Tune
         this app); absent, it follows the suite-wide choice. Light is the
         default, so this only ever ADDS `dark`.
         ⚠️ THE KEY IS DUPLICATED in src/stores/themeStore.ts, and
         src/lib/theme.test.ts holds the two together. -->
    <script>
      try {
        var pref = localStorage.getItem('unisim-painter-theme')
          || localStorage.getItem('universal:color-scheme') || 'light'
        if (pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {
        /* private mode, storage disabled: light, exactly as the store falls back. */
      }
    </script>

    <title>Universal Painter — draw and touch up pictures, without uploading them</title>
